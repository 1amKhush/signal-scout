[project]
name = "wifispot"
version = "0.1.0"
description = "Linux Wi-Fi mapping and decision assistant: find a better spot, optionally with a phone for positioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["segno>=1.6"]

[project.scripts]
wifispot = "wifispot.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wifispot"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
